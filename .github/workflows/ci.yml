name: CI
on:
  push:
    branches: [main, "agent/**"]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall app tests scripts
      - name: Run lab contract tests
        env:
          FLASK_SECRET_KEY: ci-logic-lab-secret
          LAB_MODE: "1"
        run: pytest -q
