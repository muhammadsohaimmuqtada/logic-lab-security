{% extends "base.html" %}
{% block content %}

<div class="container">
  <div class="card">
    <h2>Edit Service</h2>
    <form method="POST" action="/services/{{ service.id }}/edit">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div style="margin-bottom:10px;">
        <label>Name</label><br>
        <input class="input" name="name" value="{{ service.name }}" required>
      </div>
      <div style="margin-bottom:10px;">
        <label>Description</label><br>
        <input class="input" name="description" value="{{ service.description }}">
      </div>
      <div class="row">
        <button class="btn" type="submit">Save Changes</button>
        <a class="btn secondary" href="/services/{{ service.id }}">Cancel</a>
      </div>
    </form>
  </div>
</div>

{% endblock %}
