{% extends "base.html" %}{% block content %}
<div class="auth card"><p class="eyebrow">ONBOARDING</p><h1>Create account</h1>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Username<input name="username" minlength="3" required></label><label>Email<input type="email" name="email" required></label>
<label>Password<input type="password" name="password" minlength="8" required></label><label>Organization<input name="org_name" minlength="2" placeholder="Your team name" required></label>
<button class="btn">Create account</button></form></div>
{% endblock %}
