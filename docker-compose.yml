services:
  logiclab:
    build: .
    environment:
      FLASK_SECRET_KEY: local-docker-training-secret-change-me
      DATABASE_PATH: /app/instance/logiclab.db
      SECURITY_LOG_PATH: /app/instance/security.log
      LAB_MODE: "1"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - logiclab-data:/app/instance
    restart: unless-stopped
volumes:
  logiclab-data:
