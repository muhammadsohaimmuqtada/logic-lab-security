services:
  logiclab:
    build: .
    environment:
      LOGICLAB_INSTANCE: /app/instance
      DATABASE_PATH: /app/instance/logiclab.db
      SECURITY_LOG_PATH: /app/instance/security.log
      LAB_MODE: "1"
      GUNICORN_BIND: "0.0.0.0:8000"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - logiclab-data:/app/instance
    restart: unless-stopped
volumes:
  logiclab-data:
